# Every tool in the README lives here. Add an entry to the right section; CI rebuilds the README.
# Schema: data/schema.json. Check with `make check`. Don't hand-write stars or last-activity:
# those come from data/metadata.yaml. Old and abandoned projects stay (they're history).

completion:
